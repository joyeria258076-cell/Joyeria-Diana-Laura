<!-- Ruta: Frontend/index.html -->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/DL.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Sistema de gestión para Joyería Diana Laura"
    />
    <title>Diana Laura Joyería</title>

    <!-- Fuentes de Google (consolidadas: antes se importaban por separado y
         de forma bloqueante en 8 archivos CSS distintos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Adelanta la conexión (DNS+TLS) a donde viven las imágenes del hero
         y de producto, para que cuando React sepa qué URL mostrar la
         descarga empiece de inmediato en vez de abrir la conexión desde
         cero (esto era buena parte del "resource load delay" del LCP). -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!-- Nota: Lighthouse también sugirió preconectar a www.googleapis.com y
         apis.google.com (usados por el iframe de Firebase Auth), pero el
         propio audit recomienda no pasar de ~4 preconnects a la vez —
         demasiados compiten por el ancho de banda inicial y pueden
         terminar perjudicando más de lo que ayudan. Se prioriza lo que
         afecta directamente el LCP de esta página (fuentes + imágenes). -->

    <!-- Precarga la imagen de la primera diapositiva de respaldo del Inicio
         (la que se pinta de inmediato mientras cargan los datos reales del
         carrusel — ver InicioPublicScreen.tsx). El audit de Lighthouse
         mostró que, aun con fetchPriority="high" en el <img>, el navegador
         tardaba ~2.9s en EMPEZAR a descargarla porque nunca aparece en el
         HTML inicial (SPA sin SSR): la descubre hasta que React la
         renderiza. Este preload la hace descubrible desde ya, así que la
         descarga arranca en paralelo mientras el JS todavía se procesa.
         Costo: en el resto de rutas (login, admin, etc.) el navegador
         precarga esta imagen sin usarla — aceptable frente al ahorro real
         de ~2.9s de LCP en la página de mayor tráfico del sitio. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=1400&q=85&fit=crop"
    />
    <!-- Carga la hoja de fuentes sin bloquear el primer render: se pide
         con prioridad baja (media="print") y se activa en cuanto llega
         (onload). El <noscript> es el respaldo si JS está deshabilitado.
         Antes esto era un <link rel="stylesheet"> normal, que retrasa el
         pintado hasta que la hoja termina de descargar. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=DM+Sans:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=DM+Sans:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    
    <!-- Este es el elemento donde React montará la aplicación -->
    <div id="root"></div>
    
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
