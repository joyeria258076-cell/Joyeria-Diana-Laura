<!-- Ruta: Frontend/index.html -->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/DL.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Sistema de gestión para Joyería Diana Laura"
    />
    <title>Diana Laura Joyería</title>

    <!-- Fuentes de Google (consolidadas: antes se importaban por separado y
         de forma bloqueante en 8 archivos CSS distintos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Adelanta la conexión (DNS+TLS) a donde viven las imágenes del hero
         y de producto, para que cuando React sepa qué URL mostrar la
         descarga empiece de inmediato en vez de abrir la conexión desde
         cero (esto era buena parte del "resource load delay" del LCP). -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <!-- Nota: Lighthouse también sugirió preconectar a www.googleapis.com y
         apis.google.com (usados por el iframe de Firebase Auth), pero el
         propio audit recomienda no pasar de ~4 preconnects a la vez —
         demasiados compiten por el ancho de banda inicial y pueden
         terminar perjudicando más de lo que ayudan. Se prioriza lo que
         afecta directamente el LCP de esta página (fuentes + imágenes). -->

    <!-- El carrusel del Inicio se pide aquí, en paralelo a la descarga del
         JS, en vez de esperar a que React arranque. InicioPublicScreen lo
         toma de window.__carruselInicio. (Antes se precargaba una imagen de
         respaldo que luego se reemplazaba: eso retrasaba el LCP.) -->
    <link rel="preconnect" href="https://joyeria-diana-laura-nqnq.onrender.com" crossorigin />
    <script>
      if (location.pathname === '/') {
        window.__carruselInicio = fetch('https://joyeria-diana-laura-nqnq.onrender.com/api/content/carrusel-inicio')
          .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
      }
    </script>
    <!-- Carga la hoja de fuentes sin bloquear el primer render: se pide
         con prioridad baja (media="print") y se activa en cuanto llega
         (onload). El <noscript> es el respaldo si JS está deshabilitado.
         Antes esto era un <link rel="stylesheet"> normal, que retrasa el
         pintado hasta que la hoja termina de descargar. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    
    <!-- Este es el elemento donde React montará la aplicación -->
    <div id="root"></div>
    
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
